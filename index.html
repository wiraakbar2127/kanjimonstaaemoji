<meta name="theme-color" content="#0753c7">
<style>
:root{
  --panel:rgba(7,11,17,.90);
  --gold:#ffd75f;
  --green:#58df70;
  --red:#ef4f59;
  --cyan:#78dbff;
  --answer-bottom:62px;
}

*{box-sizing:border-box}
html,body{
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
.game{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}
input,button{
  touch-action:manipulation;
}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:"Courier New",monospace}
button,input{font:inherit}
.game{position:relative;width:100vw;height:var(--game-h,100dvh);min-height:0;overflow:hidden}
.bg{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;z-index:0;transition:filter .25s}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(rgba(0,0,0,.02),rgba(0,0,0,.04) 62%,rgba(0,0,0,.17))}

/* TOP */
.stage-counter{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  z-index:50;padding:8px 17px;border:3px solid #fff;border-radius:9px;
  background:rgba(5,9,14,.90);color:var(--gold);
  font-size:18px;font-weight:1000;letter-spacing:1px;
  text-shadow:2px 2px #000;box-shadow:0 5px 0 rgba(0,0,0,.32);
}
.turn{
  position:absolute;left:50%;top:63px;transform:translateX(-50%);
  z-index:49;padding:5px 12px;border:2px solid #fff;border-radius:999px;
  background:rgba(5,9,14,.78);font-size:11px;font-weight:1000;text-shadow:2px 2px #000;
}

/* ACTORS */
.actor{position:absolute;bottom:168px;z-index:8;transform-origin:center bottom;user-select:none}
.oni-wrap{left:14%;width:360px;height:390px}
.knight-wrap{right:14%;bottom:234px;width:255px;height:300px}

.actor-motion{position:absolute;inset:0;transform-origin:center bottom}
.oni-motion{animation:oniIdle 2s ease-in-out infinite}
.knight-motion{animation:knightIdle 1.7s ease-in-out infinite}
@keyframes oniIdle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes knightIdle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}

/* HUD attached to actor motion */
.actor-hud{
  position:absolute;left:50%;transform:translateX(-50%);
  z-index:90;
  width:240px;padding:7px 9px;background:var(--panel);
  border:2px solid #fff;border-radius:8px;box-shadow:0 5px 0 rgba(0,0,0,.32);
}
.oni-hud{bottom:318px}
.knight-hud{bottom:220px}
.hud-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:11px;font-weight:1000;color:var(--gold)}
.hud-name{color:#fff}
.hp-row{display:flex;align-items:center;gap:6px}
.hp-label{font-size:10px;font-weight:1000}
.hpbar{flex:1;height:13px;background:#451c21;border:2px solid #fff;border-radius:4px;padding:2px;overflow:hidden}
.hpfill{height:100%;transition:width .25s}
.oni-fill{background:var(--red)} .knight-fill{background:var(--green)}
.hptext{font-size:9px;min-width:60px;text-align:right;font-weight:900}

/* ONI + question move together */
.oni-body{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:330px;height:305px;display:grid;place-items:center;
  filter:drop-shadow(0 18px 0 rgba(0,0,0,.24));
}
.oni-emoji{position:absolute;inset:0;font-size:215px;line-height:1;display:flex;align-items:center;justify-content:center;overflow:visible;transform:scaleX(-1);transform-origin:center}
.oni-emoji.boss-size{font-size:345px}
.oni-emoji.no-flip{transform:scaleX(1)}
.oni-kanji{
  position:relative;z-index:4;font-size:72px;font-weight:1000;color:#fff;
  text-shadow:5px 5px #000,-3px -3px #000,3px -3px #000,-3px 3px #000,0 0 12px rgba(0,0,0,.72);
  transition:filter .18s,opacity .18s,transform .18s;
}
.oni-body.question-blur .oni-kanji{filter:blur(7px);opacity:.42;transform:scale(.94)}

/* Attack answer result on Oni: furigana, then meaning underneath */
.kanji-detail{
  position:absolute;left:50%;top:62%;transform:translateX(-50%) translateY(10px);
  z-index:6;min-width:230px;max-width:310px;padding:7px 10px;
  border:2px solid #fff;border-radius:8px;background:rgba(5,8,13,.90);
  text-align:center;font-weight:1000;text-shadow:2px 2px #000;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
}
.kanji-detail.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kanji-detail.correct{border-color:#7cff94} .kanji-detail.wrong{border-color:#ff7787}
.result-label{font-size:10px;color:#fff;margin-bottom:3px}
.result-reading{font-size:16px;color:var(--cyan);line-height:1.1}
.result-meaning{font-size:12px;color:var(--gold);margin-top:5px;line-height:1.2}


/* Boss is larger, sits higher, while its HP HUD stays fully outside/above it */
.oni-wrap.boss-stage .oni-body{
  bottom:28px;
  z-index:2;
  isolation:isolate;
}
.oni-wrap.boss-stage .oni-hud{
  bottom:362px;
  z-index:160;
}
.oni-wrap.boss-stage .oni-motion{
  overflow:visible;
}


/* FINAL BOSS AURA - always behind boss and below HP HUD */
.oni-wrap.boss-stage .oni-body::before,
.oni-wrap.boss-stage .oni-body::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:-1;
  border-radius:50%;
}
.oni-wrap.boss-stage .oni-body::before{
  width:118%;
  height:118%;
  background:
    radial-gradient(circle,
      rgba(255,255,255,.18) 0 12%,
      rgba(255,205,90,.18) 22%,
      rgba(255,80,60,.16) 42%,
      rgba(110,40,180,.18) 62%,
      rgba(0,0,0,0) 76%);
  filter:blur(14px);
  animation:bossAuraPulse 1.9s ease-in-out infinite alternate;
}
.oni-wrap.boss-stage .oni-body::after{
  width:136%;
  height:136%;
  background:
    conic-gradient(
      from 0deg,
      rgba(255,70,50,0),
      rgba(255,70,50,.20),
      rgba(120,70,255,.14),
      rgba(255,215,90,.16),
      rgba(255,70,50,0)
    );
  filter:blur(24px);
  opacity:.72;
  animation:bossAuraRotate 5.8s linear infinite;
}
.oni-wrap.boss-stage .oni-emoji{
  filter:
    drop-shadow(0 18px 0 rgba(0,0,0,.22))
    drop-shadow(0 0 16px rgba(255,95,55,.35))
    drop-shadow(0 0 34px rgba(110,75,255,.24));
}
@keyframes bossAuraPulse{
  0%{
    opacity:.58;
    transform:translate(-50%,-50%) scale(.90);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }
}
@keyframes bossAuraRotate{
  from{transform:translate(-50%,-50%) rotate(0deg) scale(1)}
  to{transform:translate(-50%,-50%) rotate(360deg) scale(1)}
}

/* KNIGHT */
.knight{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  font-size:155px;line-height:1;filter:drop-shadow(0 15px 0 rgba(0,0,0,.24));
}
.knight-emoji{display:inline-block;transform:scaleX(1);transform-origin:center}

/* ATTACK movement */
.knight.attack{animation:knightAttack .58s ease-out}
@keyframes knightAttack{
  0%{transform:translateX(-50%)}
  38%{transform:translateX(calc(-50% - 28vw)) scale(1.08)}
  62%{transform:translateX(calc(-50% - 25vw)) scale(1.04)}
  100%{transform:translateX(-50%)}
}
.oni-wrap.attack{animation:oniAttack .48s ease-out}
@keyframes oniAttack{0%{transform:translateX(0)}40%{transform:translateX(105px) scale(1.05)}72%{transform:translateX(62px)}100%{transform:translateX(0)}}
.oni-wrap.hit{animation:oniHit .16s 3}
@keyframes oniHit{40%{transform:translateX(-16px);filter:brightness(1.8)}80%{transform:translateX(9px)}}
.knight-wrap.hit{animation:knightHit .16s 3}
@keyframes knightHit{40%{transform:translateX(16px);filter:brightness(1.8)}80%{transform:translateX(-8px)}}

/* SLASH/BLOOD are attached to monster position so they always hit */
.hit-layer{position:absolute;left:0;right:0;bottom:0;height:305px;z-index:12;pointer-events:none}
.slash{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:250px;height:205px;opacity:0}
.slash::before,.slash::after{
  content:"";position:absolute;border-radius:999px;
  background:linear-gradient(90deg,transparent,#fff 20%,#fff 74%,transparent);
  box-shadow:0 0 12px #fff,0 0 29px #8ee8ff;transform-origin:center;
}
.slash::before{width:230px;height:12px;left:5px;top:74px;transform:rotate(-33deg) scaleX(.12)}
.slash::after{width:165px;height:8px;left:36px;top:119px;transform:rotate(-14deg) scaleX(.12)}
.slash.active{animation:slashBox .46s ease-out}
.slash.active::before{animation:slash1 .46s ease-out}
.slash.active::after{animation:slash2 .46s ease-out}
@keyframes slashBox{0%{opacity:0;transform:translateX(-50%) scale(.62)}17%{opacity:1}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.16)}}
@keyframes slash1{0%{transform:rotate(-33deg) scaleX(.12)}63%{transform:rotate(-33deg) scaleX(1.18)}100%{transform:rotate(-33deg) scaleX(1)}}
@keyframes slash2{0%{transform:rotate(-14deg) scaleX(.12)}70%{transform:rotate(-14deg) scaleX(1.1)}100%{transform:rotate(-14deg) scaleX(1)}}
.blood{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:180px;height:150px;opacity:0}
.drop{position:absolute;background:#b60020;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 3px #000}
.drop:nth-child(1){left:52px;top:24px;width:15px;height:15px}
.drop:nth-child(2){left:100px;top:42px;width:10px;height:10px}
.drop:nth-child(3){left:31px;top:62px;width:8px;height:8px}
.drop:nth-child(4){left:116px;top:76px;width:12px;height:12px}
.drop:nth-child(5){left:75px;top:96px;width:8px;height:8px}
.blood.active{animation:bloodFx .72s ease-out}
@keyframes bloodFx{0%{opacity:0;transform:translateX(-50%) scale(.4)}18%{opacity:1;transform:translateX(-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.2) translateY(12px)}}

/* MONSTER KANJI PROJECTILE, no emoji */
.projectile{
  position:absolute;left:27%;bottom:305px;z-index:18;display:flex;align-items:center;
  font-size:66px;font-weight:1000;color:#fff;opacity:0;pointer-events:none;white-space:nowrap;
}
.projectile .attack-word{font-size:66px;font-weight:1000;letter-spacing:2px;text-shadow:4px 4px #220008,-2px -2px #220008,0 0 22px #ff4666}
.projectile.fx-fire .attack-word{color:#fff1b2;text-shadow:4px 4px #6d1100,-2px -2px #6d1100,0 0 9px #ff3b00,0 0 24px #ff8a00;animation:kanjiFire .18s ease-in-out infinite alternate}
.projectile.fx-lightning .attack-word{color:#fff;text-shadow:3px 3px #24356f,0 0 8px #fff,0 0 19px #6ca8ff,0 0 31px #5e63ff;animation:kanjiShock .11s linear infinite alternate}
.projectile.fx-magic .attack-word{color:#f7d7ff;text-shadow:3px 3px #4d155f,0 0 9px #f06bff,0 0 25px #9b56ff;animation:kanjiMagic .35s ease-in-out infinite alternate}
.projectile.fx-impact .attack-word{color:#fff8d8;text-shadow:4px 4px #5a2500,0 0 10px #ffcf5a,0 0 28px #ff5a35;animation:kanjiImpact .17s ease-in-out infinite alternate}
@keyframes kanjiFire{from{filter:brightness(1);transform:translateY(0) scale(1)}to{filter:brightness(1.35);transform:translateY(-3px) scale(1.05)}}
@keyframes kanjiShock{from{transform:translate(-2px,1px) rotate(-1deg)}to{transform:translate(2px,-1px) rotate(1deg)}}
@keyframes kanjiMagic{from{filter:hue-rotate(0deg);transform:scale(.98)}to{filter:hue-rotate(25deg);transform:scale(1.07)}}
@keyframes kanjiImpact{from{transform:scale(.96) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
.projectile.fly{opacity:1;animation:projectileMove var(--travel,2.4s) linear forwards}
@keyframes projectileMove{0%{left:27%;transform:scale(.8) rotate(6deg)}50%{transform:scale(1.08) rotate(-4deg)}100%{left:72%;transform:scale(1.24) rotate(5deg)}}
.projectile.blocked{animation:blockFx .3s ease-out forwards!important}
@keyframes blockFx{0%{opacity:1;filter:brightness(2)}100%{opacity:0;transform:scale(2.2) rotate(-25deg)}}
.guard{position:absolute;right:9%;bottom:225px;width:195px;height:195px;border:9px solid rgba(147,228,255,.9);border-radius:50%;z-index:17;opacity:0;box-shadow:0 0 30px #76dfff,inset 0 0 20px #76dfff;pointer-events:none}
.guard.active{animation:guardFx .4s ease-out}
@keyframes guardFx{0%{opacity:0;transform:scale(.25)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}

/* Defense result at Knight, reading first then meaning below */
.player-result{
  position:absolute;right:13%;bottom:365px;z-index:36;min-width:225px;max-width:310px;
  padding:9px 11px;border:2px solid #fff;border-radius:9px;background:rgba(5,8,13,.91);
  text-align:center;font-weight:1000;text-shadow:2px 2px #000;
  opacity:0;transform:translateY(10px) scale(.95);pointer-events:none;
}
.player-result.show{opacity:1;transform:translateY(0) scale(1);transition:opacity .15s,transform .15s}
.player-result.correct{border-color:#7cff94} .player-result.wrong{border-color:#ff7787}


/* DAMAGE TEXT ATTACHED TO TARGET */
.damage-float{
  position:absolute;
  z-index:55;
  font-size:30px;
  font-weight:1000;
  text-shadow:4px 4px #000,0 0 12px rgba(0,0,0,.65);
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
}
.damage-float.monster-damage{
  left:50%;
  bottom:215px;
  transform:translateX(-50%);
  color:#ffeb72;
}
.damage-float.player-damage{
  left:50%;
  bottom:150px;
  transform:translateX(-50%);
  color:#ff7d8a;
}
.damage-float.show{
  animation:damageFloat .85s ease-out;
}
@keyframes damageFloat{
  0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.72)}
  20%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.12)}
  70%{opacity:1;transform:translateX(-50%) translateY(-18px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-34px) scale(.92)}
}

/* COMBO top, large, floating */
.combo{
  position:absolute;left:50%;top:103px;transform:translateX(-50%);z-index:38;
  opacity:0;text-align:center;font-weight:1000;
  text-shadow:5px 5px #000,0 0 18px rgba(255,215,95,.95);pointer-events:none;
}
.combo .num{font-size:102px;line-height:.78;color:var(--gold)}
.combo .txt{font-size:22px;letter-spacing:3px}
.combo.show{animation:comboPop .7s ease-out forwards,comboFloat 1.45s ease-in-out .7s infinite alternate}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.35) translateY(18px)}25%{opacity:1;transform:translateX(-50%) scale(1.2)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes comboFloat{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-9px)}}


.combo.power .num{
  color:#fff2a3;
  text-shadow:5px 5px #000,0 0 18px #ffcc39,0 0 36px #ff7b20;
}

/* NEW EXPLOSION: flash + ring + pixel sparks */
.explosion{
  position:absolute;left:50%;bottom:78px;transform:translateX(-50%);
  width:230px;height:230px;z-index:45;opacity:0;pointer-events:none;
}
.explosion .core{
  position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
  transform:translate(-50%,-50%) scale(.1);
  background:radial-gradient(circle,#fff 0 20%,#fff074 21% 38%,#ff9d00 39% 60%,#ff3700 61% 76%,transparent 77%);
  box-shadow:0 0 22px #fff,0 0 44px #ff8b00;
}
.explosion .ring{
  position:absolute;left:50%;top:50%;width:38px;height:38px;border:7px solid #ffd66a;border-radius:50%;
  transform:translate(-50%,-50%) scale(.15);box-shadow:0 0 18px #ff5b00;
}
.spark{
  position:absolute;left:50%;top:50%;width:10px;height:10px;
  background:#ffd84e;box-shadow:0 0 10px #ff4d00;
  transform:translate(-50%,-50%);opacity:0;
}
.explosion.active{opacity:1}
.explosion.active .core{animation:boomCore .72s cubic-bezier(.14,.74,.25,1) forwards}
.explosion.active .ring{animation:boomRing .78s ease-out forwards}
.explosion.active .spark{animation:boomSpark .72s ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes boomCore{
  0%{transform:translate(-50%,-50%) scale(.08);opacity:0}
  12%{opacity:1}
  42%{transform:translate(-50%,-50%) scale(2.5);opacity:1}
  100%{transform:translate(-50%,-50%) scale(4.2);opacity:0}
}
@keyframes boomRing{
  0%{transform:translate(-50%,-50%) scale(.15);opacity:0}
  18%{opacity:1}
  100%{transform:translate(-50%,-50%) scale(4);opacity:0}
}
@keyframes boomSpark{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(180deg) scale(.3)}
}
.oni-wrap.defeated{animation:monsterVanish .7s ease-out forwards!important}
@keyframes monsterVanish{0%{opacity:1;transform:scale(1)}25%{filter:brightness(2.4);transform:scale(1.08)}58%{opacity:.55;transform:scale(.82)}100%{opacity:0;transform:scale(.08)}}

/* stage travel: monster disappears first, then Knight runs */
.knight-wrap.stage-run-out{animation:stageRunOut 1.15s linear forwards!important}
@keyframes stageRunOut{
  0%{transform:translateX(0);opacity:1}
  15%{transform:translateX(-5vw) translateY(-5px)}
  35%{transform:translateX(-18vw) translateY(3px)}
  55%{transform:translateX(-34vw) translateY(-5px)}
  75%{transform:translateX(-51vw) translateY(3px)}
  100%{transform:translateX(-72vw);opacity:.18}
}
.knight-wrap.stage-run-in{animation:stageRunIn .8s ease-out forwards!important}
@keyframes stageRunIn{0%{transform:translateX(42vw);opacity:.15}55%{opacity:1}100%{transform:translateX(0);opacity:1}}
.bg.stage-pan{animation:stagePan 1.45s ease-in-out}
@keyframes stagePan{0%{transform:translateX(0) scale(1)}50%{transform:translateX(4%) scale(1.05)}100%{transform:translateX(0) scale(1)}}
.oni-wrap.spawn{animation:monsterSpawn .62s ease-out}
@keyframes monsterSpawn{0%{opacity:0;transform:translateY(-24px) scale(.72)}60%{opacity:1;transform:translateY(4px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}


/* UNIFIED RESULT PANEL ABOVE ANSWER BAR */
.answer-result{
  position:absolute;
  left:50%;
  bottom:var(--answer-bottom);
  transform:translateX(-50%) translateY(6px);
  z-index:44;
  width:min(520px,calc(100vw - 180px));
  min-height:64px;
  padding:8px 14px 9px;
  border:3px solid #fff;
  border-radius:12px;
  background:rgba(5,8,13,.96);
  box-shadow:0 7px 0 rgba(0,0,0,.35);
  text-align:center;
  font-weight:1000;
  text-shadow:2px 2px #000;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
}
.answer-result.show{opacity:1;transform:translateX(-50%) translateY(0)}
.answer-result.correct{border-color:#7cff94}
.answer-result.wrong{border-color:#ff7787}
.answer-result.neutral{border-color:var(--gold)}
.answer-result .result-label{
  font-size:11px;
  color:#fff;
  margin-bottom:5px;
  letter-spacing:1px;
}
.answer-result .result-reading{
  font-size:25px;
  color:var(--cyan);
  line-height:1.12;
}
.answer-result .result-meaning{
  margin-top:4px;
  font-size:14px;
  color:var(--gold);
  line-height:1.25;
}
.answer-result .result-extra{
  margin-top:7px;
  font-size:12px;
  color:#fff;
  opacity:.88;
}

/* SPECIAL COMBO ATTACK */
.special-flash{
  position:absolute;
  inset:0;
  z-index:43;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle at 28% 55%,rgba(255,255,255,.95) 0 2%,rgba(255,215,95,.7) 3% 9%,transparent 23%),
    linear-gradient(90deg,transparent 0 35%,rgba(255,255,255,.55) 48%,transparent 60%);
}
.special-flash.active{animation:specialFlash .72s ease-out}
@keyframes specialFlash{
  0%{opacity:0}
  14%{opacity:1}
  42%{opacity:.85}
  100%{opacity:0}
}
.special-slash{
  position:absolute;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  width:310px;
  height:245px;
  z-index:30;
  opacity:0;
  pointer-events:none;
}
.special-slash::before,
.special-slash::after{
  content:"";
  position:absolute;
  left:12px;
  top:95px;
  width:285px;
  height:16px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,#fff 16%,#fff8a8 40%,#fff 75%,transparent);
  box-shadow:0 0 16px #fff,0 0 38px #ffd45a,0 0 70px #ff8c2b;
  transform-origin:center;
}
.special-slash::before{transform:rotate(-35deg) scaleX(.08)}
.special-slash::after{
  top:125px;
  width:245px;
  left:32px;
  transform:rotate(26deg) scaleX(.08);
}
.special-slash.active{animation:specialBox .75s ease-out}
.special-slash.active::before{animation:specialSlashA .75s ease-out}
.special-slash.active::after{animation:specialSlashB .75s ease-out}
@keyframes specialBox{
  0%{opacity:0;transform:translateX(-50%) scale(.55)}
  14%{opacity:1}
  70%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(1.35)}
}
@keyframes specialSlashA{
  0%{transform:rotate(-35deg) scaleX(.08)}
  58%{transform:rotate(-35deg) scaleX(1.28)}
  100%{transform:rotate(-35deg) scaleX(1)}
}
@keyframes specialSlashB{
  0%{transform:rotate(26deg) scaleX(.08)}
  65%{transform:rotate(26deg) scaleX(1.18)}
  100%{transform:rotate(26deg) scaleX(1)}
}
.special-text{
  position:absolute;
  left:50%;
  top:195px;
  transform:translateX(-50%) scale(.6);
  z-index:46;
  opacity:0;
  color:#fff6a8;
  font-size:32px;
  font-weight:1000;
  text-align:center;
  text-shadow:4px 4px #000,0 0 18px #ff9d22;
  pointer-events:none;
}
.special-text.show{animation:specialText .95s ease-out}
@keyframes specialText{
  0%{opacity:0;transform:translateX(-50%) scale(.45) translateY(15px)}
  18%{opacity:1;transform:translateX(-50%) scale(1.18) translateY(0)}
  68%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0}
}


.answer-zone.shake{
  animation:answerShake .38s ease-in-out;
}
.answer-zone.shake input{
  border-color:#ff7887;
  box-shadow:0 0 0 2px rgba(255,90,110,.20),0 7px 0 rgba(0,0,0,.35);
}
@keyframes answerShake{
  0%,100%{transform:translateX(-50%)}
  15%{transform:translateX(calc(-50% - 9px))}
  30%{transform:translateX(calc(-50% + 8px))}
  45%{transform:translateX(calc(-50% - 7px))}
  60%{transform:translateX(calc(-50% + 6px))}
  75%{transform:translateX(calc(-50% - 3px))}
}


.answer-zone{
  transition:opacity .14s ease,transform .14s ease;
}
.answer-zone.result-hidden{
  opacity:0;
  pointer-events:none;
}

/* ANSWER */
.answer-zone{
  position:absolute;left:50%;bottom:var(--answer-bottom);transform:translateX(-50%);
  z-index:30;width:min(520px,calc(100vw - 180px));display:flex;
}
.answer-zone input{
  width:100%;min-width:0;height:64px;border:3px solid #fff;border-radius:12px;
  background:rgba(5,8,13,.92);color:#fff;padding:0 20px;text-align:center;
  font-size:27px;font-weight:1000;outline:none;box-shadow:0 7px 0 rgba(0,0,0,.35);
}
.answer-zone input:focus{border-color:var(--gold)}
.action{width:66px;height:62px;border:3px solid #fff;border-radius:12px;background:rgba(16,24,38,.94);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.35)}
.action.guard-mode{background:#14506a}
.action:active{transform:translateY(2px)}

/* ITEMS / SOUND */
.tools{position:absolute;right:18px;bottom:var(--answer-bottom);z-index:31;display:flex;flex-direction:column;gap:10px}
.tool{width:68px;height:68px;border-radius:14px;border:3px solid #fff;background:rgba(5,9,14,.9);color:#fff;font-size:30px;display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 7px 0 rgba(0,0,0,.35)}
.tool:active{transform:translateY(2px)}
.count{position:absolute;right:-5px;bottom:-5px;min-width:23px;height:23px;padding:0 4px;border-radius:12px;background:#111;border:2px solid #fff;font-size:11px;display:grid;place-items:center;font-weight:1000}

.toast{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);z-index:41;font-size:18px;font-weight:1000;text-shadow:3px 3px #000;opacity:0;white-space:nowrap}
.toast.show{animation:toastFx .8s ease-out}
@keyframes toastFx{0%{opacity:0;transform:translateX(-50%) translateY(8px)}22%{opacity:1;transform:translateX(-50%)}75%{opacity:1}100%{opacity:0}}

.overlay{position:absolute;inset:0;z-index:70;display:none;place-items:center;background:rgba(1,3,6,.80)}
.overlay.show{display:grid}
.modal{width:min(430px,90vw);padding:24px;text-align:center;background:#0c1119;border:3px solid #fff;border-radius:11px}
.modal h2{color:var(--gold);margin:0 0 10px}
.modal button{padding:10px 16px;border:2px solid #fff;background:#273753;color:#fff;border-radius:7px;cursor:pointer}


@media(min-width:761px){

}

  .oni-emoji.boss-size{font-size:220px}

  .result-reading{font-size:13px} .result-meaning{font-size:10px}

  .answer-result{left:8px;right:68px;bottom:var(--answer-bottom);transform:translateY(6px);width:auto;min-height:56px;padding:6px 10px;border-radius:12px;background:rgba(5,8,13,.96);border:3px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.35)}

    30%{transform:translateX(8px)}
    45%{transform:translateX(-7px)}

}

/* Mobile portrait is the primary phone layout. */
@media(max-width:760px) and (orientation:portrait){
  .stage-counter{top:6px}
  .turn{top:44px}
}

/* When the phone keyboard is visible, shrink the arena to the VisualViewport.
   The input remains focused, so the keyboard can stay open between turns. */
@media(max-width:760px){
  body.keyboard-open{
    --answer-bottom:7px;
  }
  body.keyboard-open .stage-counter{
    top:3px;
    padding:4px 9px;
    border-width:2px;
    font-size:11px;
  }
  body.keyboard-open .turn{

/* MOBILE GAME CANVAS: never create a scrollable page */
@media(max-width:760px){
  html,
  body{
    width:100% !important;
    height:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    max-width:100% !important;
    max-height:100% !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    overscroll-behavior:none !important;
  }

  body{
    position:fixed !important;
    inset:0 !important;
    touch-action:none;
  }

  .game{
    position:fixed !important;
    left:0 !important;
    top:var(--game-top,0px) !important;
    width:100vw !important;
    height:var(--game-h,100dvh) !important;
    min-height:0 !important;
    max-height:var(--game-h,100dvh) !important;
    overflow:hidden !important;
    overscroll-behavior:none !important;
  }

  .answer-zone,
  .answer-result,
  .tools,
  .actor,
  .stage-counter,
  .turn{
    max-width:100vw;
  }
}

function focusAnswerInput(){

function doPlayerAttack(){
  if(phase!=="player")return;
  const q=currentQuestion();
  const ans=normalizeKana(input.value);

  if(!ans){
    rejectEmptyAnswer();
    return;
  }

  lockAnswerInput();

  const correct=ans===normalizeKana(q.r);

  if(correct){
    combo++;
    showCombo();

    const baseDmg=24+Math.floor(Math.random()*10)+Math.min(combo*2,12);
    const specialBonus=specialBonusForCombo(combo);
    const dmg=baseDmg+specialBonus;
    monsterHP-=dmg;
    showDamage("monster",dmg);
    updateUI();

    retrigger("knight","attack",620);

    /* Every successful attack uses the exact same answer table:
       BENAR, furigana, then meaning. */
    revealAnswerResult(q,"correct","BENAR");

    /* Once the hit succeeds, remove the current Kanji immediately.
       The next Kanji will only appear again on the next turn. */
    $("questionKanji").textContent="";
    hideKanjiDetail();

    if(specialBonus>0){
      triggerSpecialAttack(combo,specialBonus);
    }else{
      setTimeout(()=>retrigger("slashFx","active",500),185);
      setTimeout(()=>retrigger("bloodFx","active",760),245);
      setTimeout(()=>retrigger("oniWrap","hit",560),235);
      slashSfx();
    }

    nextQuestion();

    if(monsterHP<=0) holdResult(monsterDefeated,2800);
    else holdResult(monsterTurn,2800);
  }else{
    clearCombo();
    revealAnswerResult(q,"wrong","SALAH");
    nextQuestion();
    holdResult(monsterTurn,2600);
  }
}

function defenseTravelSeconds(word,reading){
  const kanjiLength=[...word].length;
  const readingLength=[...reading].length;

  /*
    Longer vocabulary receives more reaction time.
    Rough targets before level scaling:
    1 kanji  ≈ 2.5 s
    2 kanji  ≈ 3.0 s
    3 kanji  ≈ 3.5 s
    4 kanji  ≈ 4.0 s
    Long readings receive a small additional allowance.
  */
  const lengthTime=2.05+(kanjiLength*0.45)+(Math.max(0,readingLength-4)*0.08);
  const levelPressure=Math.min(0.55,(playerLevel-1)*0.035);

  return Math.max(1.9,Math.min(5.2,lengthTime-levelPressure));
}

/* Romaji -> Hiragana. Final ん requires nn unless n is followed by another consonant. */
const ROMAJI_TABLE={
  "kya":"きゃ","kyu":"きゅ","kyo":"きょ","sha":"しゃ","shu":"しゅ","sho":"しょ",
  "cha":"ちゃ","chu":"ちゅ","cho":"ちょ","nya":"にゃ","nyu":"にゅ","nyo":"にょ",
  "hya":"ひゃ","hyu":"ひゅ","hyo":"ひょ","mya":"みゃ","myu":"みゅ","myo":"みょ",
  "rya":"りゃ","ryu":"りゅ","ryo":"りょ","gya":"ぎゃ","gyu":"ぎゅ","gyo":"ぎょ",
  "bya":"びゃ","byu":"びゅ","byo":"びょ","pya":"ぴゃ","pyu":"ぴゅ","pyo":"ぴょ",
  "ja":"じゃ","ju":"じゅ","jo":"じょ","shi":"し","chi":"ち","tsu":"つ","fu":"ふ",
  "ka":"か","ki":"き","ku":"く","ke":"け","ko":"こ","sa":"さ","si":"し","su":"す","se":"せ","so":"そ",
  "ta":"た","ti":"ち","tu":"つ","te":"て","to":"と","na":"な","ni":"に","nu":"ぬ","ne":"ね","no":"の",
  "ha":"は","hi":"ひ","hu":"ふ","he":"へ","ho":"ほ","ma":"ま","mi":"み","mu":"む","me":"め","mo":"も",
  "ya":"や","yu":"ゆ","yo":"よ","ra":"ら","ri":"り","ru":"る","re":"れ","ro":"ろ","wa":"わ","wo":"を",
  "ga":"が","gi":"ぎ","gu":"ぐ","ge":"げ","go":"ご","za":"ざ","ji":"じ","zu":"ず","ze":"ぜ","zo":"ぞ",
  "da":"だ","di":"ぢ","du":"づ","de":"で","do":"ど","ba":"ば","bi":"び","bu":"ぶ","be":"べ","bo":"ぼ",
  "pa":"ぱ","pi":"ぴ","pu":"ぷ","pe":"ぺ","po":"ぽ","a":"あ","i":"い","u":"う","e":"え","o":"お"
};
function romajiToHiragana(text){
  const s=text.toLowerCase();let out="",i=0;
  while(i<s.length){
    const ch=s[i];
    if(/[ぁ-んー]/.test(ch)){out+=ch;i++;continue}
    if(!/[a-z]/.test(ch)){out+=ch;i++;continue}

    if(i+1<s.length&&s[i]===s[i+1]&&/[bcdfghjklmpqrstvwxyz]/.test(s[i])&&s[i]!=="n"){
      out+="っ";i++;continue;
    }

    if(ch==="n"){
      const next=s[i+1]||"",after=s[i+2]||"";
      if(next===""){out+="n";i++;continue}
      if(next==="n"){
        out+="ん";
        i+=after===""?2:1;
        continue;
      }
      if(/[bcdfghjklmpqrstvwxyz]/.test(next)&&next!=="y"){out+="ん";i++;continue}
      if(next==="'"){out+="ん";i+=2;continue}
    }

    let matched=false;
    for(const len of [3,2,1]){
      const part=s.slice(i,i+len);
      if(ROMAJI_TABLE[part]){out+=ROMAJI_TABLE[part];i+=len;matched=true;break}
    }
    if(!matched){out+=ch;i++}
  }
  return out;
}

function forceMobileKeyboardFocus(){
  if(!isMobileUI()) return;

  input.disabled=false;

  try{
    input.focus({preventScroll:true});
    input.setSelectionRange(input.value.length,input.value.length);
  }catch(e){
    try{ input.focus(); }catch(_){}
  }
}

/*
  Mobile browsers may block opening the software keyboard without a user gesture.
  We try immediately on load, then repeat on the first touch/pointer interaction.
*/
function bootstrapMobileKeyboard(){
  if(!isMobileUI()) return;

  setTimeout(forceMobileKeyboardFocus,80);
  setTimeout(forceMobileKeyboardFocus,320);

  const firstGesture=()=>{
    forceMobileKeyboardFocus();
    setTimeout(forceMobileKeyboardFocus,60);
  };

  document.addEventListener("pointerdown",firstGesture,{once:true,capture:true});
  document.addEventListener("touchstart",firstGesture,{once:true,capture:true,passive:true});
}

window.addEventListener("pageshow",()=>{
  if(isMobileUI()){
    setTimeout(forceMobileKeyboardFocus,120);
  }
},{passive:true});

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && isMobileUI() && phase!=="ended"){
    setTimeout(forceMobileKeyboardFocus,120);
  }
});

/* Block pinch zoom and iOS gesture zoom inside the game. */
document.addEventListener("gesturestart",event=>{
  if(isMobileUI()) event.preventDefault();
},{passive:false});

document.addEventListener("gesturechange",event=>{
  if(isMobileUI()) event.preventDefault();
},{passive:false});

document.addEventListener("gestureend",event=>{
  if(isMobileUI()) event.preventDefault();
},{passive:false});

document.addEventListener("touchmove",event=>{
  if(isMobileUI() && event.touches && event.touches.length>1){
    event.preventDefault();
  }
},{passive:false});

let lastTouchEnd=0;
document.addEventListener("touchend",event=>{
  if(!isMobileUI()) return;

  const now=Date.now();
  if(now-lastTouchEnd<=300){
    event.preventDefault();
  }
  lastTouchEnd=now;
},{passive:false});



/* The game itself never scrolls on mobile, including while the keyboard is open. */
document.addEventListener("touchmove",event=>{
  if(isMobileUI()){
    event.preventDefault();
  }
},{passive:false});

document.addEventListener("wheel",event=>{
  if(isMobileUI()){
    event.preventDefault();
  }
},{passive:false});

window.addEventListener("scroll",()=>{
  if(isMobileUI() && (window.scrollX!==0 || window.scrollY!==0)){
    window.scrollTo(0,0);
  }
},{passive:true});


/* Mobile viewport / software-keyboard adaptation */
let mobileViewportBaseline=0;

function syncGameViewport(){
  const vv=window.visualViewport;
  const visibleHeight=vv ? vv.height : window.innerHeight;
  const visibleWidth=vv ? vv.width : window.innerWidth;
  const visibleTop=vv ? vv.offsetTop : 0;

  document.documentElement.style.setProperty("--game-h",`${Math.round(visibleHeight)}px`);
  document.documentElement.style.setProperty("--game-top",`${Math.round(visibleTop)}px`);

  if(isMobileUI()){
    mobileViewportBaseline=Math.max(
      mobileViewportBaseline,
      window.innerHeight,
      visibleHeight + visibleTop
    );

    const keyboardLoss=mobileViewportBaseline-visibleHeight;
    const keyboardOpen=keyboardLoss>90 || visibleHeight<mobileViewportBaseline*.78;

    document.body.classList.toggle("keyboard-open",keyboardOpen);
    document.documentElement.classList.toggle("mobile-portrait",visibleHeight>=visibleWidth);

    /* Never allow browser focus/keyboard behavior to create page scrolling. */
    if(window.scrollX!==0 || window.scrollY!==0){
      window.scrollTo(0,0);
    }
  }else{
    document.body.classList.remove("keyboard-open");
    document.documentElement.classList.remove("mobile-portrait");
  }
}

window.addEventListener("resize",syncGameViewport,{passive:true});
window.addEventListener("orientationchange",()=>{
  mobileViewportBaseline=0;
  setTimeout(syncGameViewport,120);
},{passive:true});

if(window.visualViewport){
  window.visualViewport.addEventListener("resize",syncGameViewport,{passive:true});
  window.visualViewport.addEventListener("scroll",syncGameViewport,{passive:true});
}

syncGameViewport();


/* Audio */
/* Medieval adventure theme: D Dorian, 6/8, drone + plucked strings */
const medievalMelody=[
  293.66,349.23,392.00,440.00,392.00,349.23,
  293.66,261.63,293.66,349.23,392.00,293.66,
  440.00,523.25,587.33,523.25,440.00,392.00,
  349.23,392.00,440.00,392.00,349.23,293.66,

  293.66,392.00,440.00,523.25,440.00,392.00,
  349.23,293.66,261.63,293.66,349.23,392.00,
  440.00,392.00,349.23,293.66,261.63,293.66,
  349.23,392.00,293.66,261.63,293.66,293.66
];

const medievalChords=[
  [146.83,220.00,293.66], /* Dm-ish drone */
  [174.61,261.63,349.23], /* F */
  [196.00,293.66,392.00], /* G */
  [130.81,196.00,261.63]  /* C */
];

function ensureMusic(){
  if(!musicOn)return;
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();

  if(!musicTimer){
    musicTick();
    musicTimer=setInterval(musicTick,185);
  }
}

function tone(freq,dur=.1,type="square",gain=.025){
  if(!audioCtx)return;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(gain,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);

  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime+dur);
}

function pluckTone(freq,dur=.22,gain=.018){
  if(!audioCtx)return;

  const o1=audioCtx.createOscillator();
  const o2=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o1.type="triangle";
  o2.type="square";
  o1.frequency.value=freq;
  o2.frequency.value=freq*2;

  g.gain.setValueAtTime(gain,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);

  o1.connect(g);
  o2.connect(g);
  g.connect(audioCtx.destination);

  o1.start();
  o2.start();
  o1.stop(audioCtx.currentTime+dur);
  o2.stop(audioCtx.currentTime+Math.min(.08,dur));
}

function noiseHit(dur=.04,gain=.009){
  if(!audioCtx)return;

  const length=Math.max(1,Math.floor(audioCtx.sampleRate*dur));
  const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1)*(1-i/length);
  }

  const src=audioCtx.createBufferSource();
  const g=audioCtx.createGain();
  src.buffer=buffer;
  g.gain.setValueAtTime(gain,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);

  src.connect(g);
  g.connect(audioCtx.destination);
  src.start();
}

function musicTick(){
  if(!musicOn||!audioCtx)return;

  const step=beat%medievalMelody.length;
  const beatInBar=step%6;
  const chordIndex=Math.floor(step/6)%medievalChords.length;
  const chord=medievalChords[chordIndex];

  /* Recorder / pipe-like lead */
  pluckTone(medievalMelody[step],.20,.015);

  /* Bardic lute pattern */
  if(beatInBar===0 || beatInBar===3){
    pluckTone(chord[0],.40,.020);
    pluckTone(chord[1],.28,.010);
  }else{
    pluckTone(chord[2],.12,.006);
  }

  /* Low medieval drone on the first pulse of each 6/8 bar */
  if(beatInBar===0){
    tone(73.42,.92,"triangle",.017);
    tone(110.00,.76,"sine",.010);
  }

  /* Light frame-drum pulse: strong on 1, softer on 4 */
  if(beatInBar===0){
    tone(62,.07,"sine",.023);
  }else if(beatInBar===3){
    noiseHit(.045,.008);
  }

  beat++;
}

function slashSfx(){ensureMusic();tone(740,.055,"sawtooth",.045);setTimeout(()=>tone(230,.09,"square",.04),45)}
function hitSfx(){ensureMusic();tone(90,.13,"sawtooth",.05)}
function guardSfx(){ensureMusic();tone(880,.06,"square",.04);setTimeout(()=>tone(1180,.08,"square",.03),55)}
function explosionSfx(){ensureMusic();tone(70,.26,"sawtooth",.07);setTimeout(()=>tone(45,.32,"square",.055),60)}
function toggleMusic(){
  musicOn=!musicOn;
  $("musicBtn").textContent=musicOn?"🎵":"🔇";
  if(!musicOn&&musicTimer){clearInterval(musicTimer);musicTimer=null}
  if(musicOn)ensureMusic();
}
$("musicBtn").addEventListener("click",()=>{if(!audioCtx)ensureMusic();toggleMusic()});
document.addEventListener("pointerdown",ensureMusic,{once:true});

setMonster();
setQuestionDisplay(currentQuestion());
updateUI();
playerTurn();
bootstrapMobileKeyboard();
</script>
